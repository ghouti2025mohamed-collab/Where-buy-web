
name: Extract Where Buy Web

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/unzip-project.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -name package.json -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          cp -R "$PROJECT_DIR"/. .

          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Extract Where Buy Web project"
            git push
          fi
